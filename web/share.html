<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>API Documentation</title>
<script>(function(){var t=localStorage.getItem('api-platform-theme')||'light';document.documentElement.setAttribute('data-theme',t);var l=document.createElement('link');l.id='hljs-theme';l.rel='stylesheet';l.href=t==='dark'?'https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.0/styles/atom-one-dark.min.css':'https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.0/styles/atom-one-light.min.css';document.head.appendChild(l);})()</script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#080c17;--bg2:rgba(14,20,38,.7);--bg3:rgba(20,28,48,.65);--border:rgba(99,120,180,.18);--text:#e8ecf4;--text2:#99a4c4;--muted:#5a658a;--accent:#60a5fa;--success:#34d877;--danger:#ff4d6a;--warning:#f5a623;--method-get:#4dc9f6;--method-post:#34d877;--method-put:#f5a623;--method-patch:#a78bfa;--method-delete:#ff4d6a;--method-head:#4dd0e1;--method-options:#c084fc;--radius:14px;--font-mono:"SF Mono","Fira Code","JetBrains Mono","Consolas",monospace}
[data-theme="light"]{--bg:#f0f2f8;--bg2:rgba(255,255,255,.55);--bg3:rgba(245,246,252,.7);--border:rgba(0,0,0,.08);--text:#1a1d2e;--text2:#5a6280;--muted:#8890b0;--accent:#3b82f6;--success:#00b868;--danger:#e53450;--warning:#d68910;--method-get:#0984e3;--method-post:#00b868;--method-put:#d68910;--method-patch:#6c5ce7;--method-delete:#e53450;--method-head:#00acc1;--method-options:#a55adb}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;position:relative}
body::before{content:'';position:fixed;inset:0;z-index:-2;
  background:radial-gradient(ellipse 70% 60% at 20% 20%,rgba(96,165,250,.06) 0%,transparent 60%),
    radial-gradient(ellipse 60% 50% at 80% 30%,rgba(56,189,248,.04) 0%,transparent 60%),
    radial-gradient(ellipse 80% 70% at 50% 80%,rgba(52,216,119,.03) 0%,transparent 60%);
  animation:bgShift 20s ease-in-out infinite alternate}
@keyframes bgShift{0%{transform:scale(1)rotate(0deg)}50%{transform:scale(1.15)rotate(1deg)}100%{transform:scale(1.05)rotate(-.5deg)}}
.container{max-width:960px;margin:0 auto;padding:40px 24px;position:relative;z-index:1;opacity:0;transition:opacity .2s}
.container.ready{opacity:1}
.header{text-align:center;padding:48px 0 56px;border-bottom:1px solid var(--border);margin-bottom:40px}
.header h1{font-size:32px;font-weight:800;margin-bottom:12px;letter-spacing:-.4px;
  background:linear-gradient(135deg,#60a5fa 0%,#38bdf8 50%,#7dd3fc 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  filter:drop-shadow(0 0 8px rgba(96,165,250,.3))}
.header .meta{color:var(--text2);font-size:13px}
.doc-endpoint{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:24px;overflow:hidden;
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);transition:all .25s ease;position:relative}
.doc-endpoint::before{content:'';position:absolute;inset:-1px;border-radius:var(--radius);
  background:linear-gradient(135deg,transparent 0%,rgba(96,165,250,.2) 50%,transparent 100%);
  opacity:0;transition:opacity .35s;z-index:-1}
.doc-endpoint:hover{box-shadow:0 12px 40px rgba(0,0,0,.45);border-color:rgba(96,165,250,.18);transform:translateY(-2px)}
.doc-endpoint:hover::before{opacity:1}
.doc-endpoint-header{display:flex;align-items:center;padding:16px 22px;background:var(--bg3);gap:14px}
.doc-ep-method{font-size:11px;font-weight:700;letter-spacing:.6px;padding:5px 13px;border-radius:6px;min-width:64px;text-align:center;text-transform:uppercase}
.doc-ep-method.get{background:rgba(77,201,246,.15);color:var(--method-get);border:1px solid rgba(77,201,246,.25)}
.doc-ep-method.post{background:rgba(52,216,119,.15);color:var(--method-post);border:1px solid rgba(52,216,119,.25)}
.doc-ep-method.put{background:rgba(245,166,35,.15);color:var(--method-put);border:1px solid rgba(245,166,35,.25)}
.doc-ep-method.patch{background:rgba(168,123,250,.15);color:var(--method-patch);border:1px solid rgba(168,123,250,.25)}
.doc-ep-method.delete{background:rgba(255,77,106,.15);color:var(--method-delete);border:1px solid rgba(255,77,106,.25)}
.doc-ep-method.head{background:rgba(77,209,225,.15);color:var(--method-head);border:1px solid rgba(77,209,225,.25)}
.doc-ep-method.options{background:rgba(192,132,252,.15);color:var(--method-options);border:1px solid rgba(192,132,252,.25)}
.doc-ep-url{flex:1;font-family:var(--font-mono);font-size:15px;font-weight:600;word-break:break-all}
.doc-ep-status{font-size:12px;font-weight:600;padding:5px 13px;border-radius:20px;white-space:nowrap}
.doc-ep-status.success{background:rgba(52,216,119,.08);color:var(--success);border:1px solid rgba(52,216,119,.2)}
.doc-ep-status.error{background:rgba(255,77,106,.08);color:var(--danger);border:1px solid rgba(255,77,106,.2)}
.doc-ep-status.redirect{background:rgba(245,166,35,.08);color:var(--warning);border:1px solid rgba(245,166,35,.2)}
.doc-ep-title{font-size:17px;font-weight:700;letter-spacing:-.3px;color:var(--accent);padding:18px 22px 12px;display:flex;align-items:center;gap:10px}
.doc-endpoint-body{padding:24px 28px}
.doc-endpoint-body h3{font-size:13px;margin:20px 0 10px;font-weight:700;
  background:rgba(96,165,250,.1);color:var(--accent);border:1px solid rgba(96,165,250,.12);
  padding:7px 16px;border-radius:8px;display:inline-block;letter-spacing:.4px;text-transform:uppercase}
.doc-endpoint-body h3:first-child{margin-top:0}
.doc-endpoint-body table{width:100%;border-collapse:collapse;margin-bottom:18px;font-size:12.5px}
.doc-endpoint-body th,.doc-endpoint-body td{border:1px solid var(--border);padding:9px 12px;text-align:left}
.doc-endpoint-body th{background:var(--bg3);font-weight:600;font-size:11.5px;color:var(--text2);text-transform:uppercase;letter-spacing:.3px}
.doc-endpoint-body pre{padding:18px 20px;border-radius:10px;overflow-x:auto;margin:10px 0 18px;border:1px solid var(--border);font-size:13px;line-height:1.55}
.doc-endpoint-body pre code{background:none!important;padding:0!important}
.doc-endpoint-body blockquote{border-left:3px solid var(--accent);padding:8px 18px;color:var(--text2);margin:14px 0;background:rgba(96,165,250,.06);border-radius:0 8px 8px 0}
.doc-endpoint-body p{margin:10px 0;line-height:1.7}
.doc-endpoint-body ul,.doc-endpoint-body ol{padding-left:24px;margin:10px 0}
.doc-endpoint-body li{margin:5px 0}
.doc-endpoint-body code{background:var(--bg3);padding:2px 7px;border-radius:5px;font-size:12px;font-family:var(--font-mono);border:1px solid var(--border)}
.doc-endpoint-body strong{font-weight:600}
.footer{text-align:center;padding:40px 0;color:var(--muted);font-size:12px;border-top:1px solid var(--border);margin-top:48px}
.footer a{color:var(--accent);text-decoration:none}
.spinner{width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite;margin:40px auto}
@keyframes spin{to{transform:rotate(360deg)}}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--muted)}
.theme-btn{position:fixed;top:16px;right:16px;background:rgba(14,20,38,.7);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.06);color:var(--text2);padding:10px 16px;border-radius:10px;cursor:pointer;font-size:16px;transition:all .2s}
.theme-btn:hover{background:var(--bg3);border-color:var(--accent);color:var(--text);transform:translateY(-1px)}
</style>
</head>
<body>
<button class="theme-btn" id="theme-btn" title="Toggle theme">☀️</button>
<div class="container">
  <div class="header">
    <h1 id="doc-title">Loading...</h1>
    <div class="meta" id="doc-meta"></div>
  </div>
  <div id="doc-content"><div class="spinner"></div></div>
  <div class="footer">Generated by <strong>API Platform</strong></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
(function(){
  var alias = location.pathname.replace(/^\/share\//,'');
  if(!alias){document.getElementById('doc-content').innerHTML='<p style="text-align:center;color:var(--danger)">Invalid document</p>';return;}

  // Theme toggle
  var theme = localStorage.getItem('api-platform-theme') || 'light';
  function applyTheme() {
    document.documentElement.setAttribute('data-theme', theme);
    document.getElementById('theme-btn').textContent = theme === 'dark' ? '☀️' : '🌙';
  }
  document.getElementById('theme-btn').addEventListener('click', function() {
    theme = theme === 'dark' ? 'light' : 'dark';
    localStorage.setItem('api-platform-theme', theme);
    applyTheme();
  });
  applyTheme();
  // Lookup doc by alias
  fetch('/api/docs/list').then(function(r){return r.json()}).then(function(docs){
    var doc = docs.find(function(d){return d.alias === alias;});
    if(!doc) throw new Error('not found');
    document.title = doc.title + ' - API Docs';
    document.getElementById('doc-title').textContent = doc.title;
    document.getElementById('doc-meta').textContent = 'Updated ' + new Date(doc.updatedAt).toLocaleString();
    render(doc.content);
    document.querySelector('.container').classList.add('ready');
  }).catch(function(e){document.getElementById('doc-content').innerHTML='<p style="text-align:center;color:var(--danger)">Document not found</p>';document.querySelector('.container').classList.add('ready');});

  function translateMd(md){
    var t = {status:'Status',requestHeaders:'Request Headers',requestBody:'Request Body',responseExample:'Response Example',type:'Type',responseTruncated:'response truncated',key:'Key',value:'Value',description:'Description'};
    // Try to get translations from localStorage or just use English/Chinese
    var lang = localStorage.getItem('api-platform-lang') || (navigator.language||'').startsWith('zh')?'中文':'En';
    if(lang==='中文'){t={status:'状态',requestHeaders:'请求头',requestBody:'请求体',responseExample:'响应示例',type:'类型',responseTruncated:'响应过长已截断',key:'键',value:'值',description:'描述'};}
    var result = md
      .replace(/^>\s*状态\s*(\d+)/gm,'> '+t.status+' $1')
      .replace(/^>\s*Status\b/gm,'> '+t.status)
      .replace(/^###\s+请求头\b/gm,'### '+t.requestHeaders)
      .replace(/\bRequest Headers\b/g,t.requestHeaders)
      .replace(/^###\s+请求体\b/gm,'### '+t.requestBody)
      .replace(/\bRequest Body\b/g,t.requestBody)
      .replace(/^###\s+响应示例\b/gm,'### '+t.responseExample)
      .replace(/\bResponse Example\b/g,t.responseExample)
      .replace(/\*\*类型\*\*/g,'**'+t.type+'**')
      .replace(/\*\*Type\*\*/g,'**'+t.type+'**')
      .replace(/\(响应过长已截断\)/g,'('+t.responseTruncated+')')
      .replace(/\(response truncated\)/g,'('+t.responseTruncated+')');
    // Table headers
    result = result
      .replace(/^\|[\s]*Key[\s]*\|/gm,'| '+t.key+' |')
      .replace(/\|[\s]*Value[\s]*\|/g,'| '+t.value+' |')
      .replace(/\|[\s]*Type[\s]*\|/g,'| '+t.type+' |')
      .replace(/\|[\s]*Description[\s]*\|/g,'| '+t.description+' |');
    return result;
  }
  function render(md){
    if(typeof marked==='undefined'){document.getElementById('doc-content').innerHTML='<pre>'+esc(md)+'</pre>';return;}
    var clean = md.replace(/<!--history-id:\d+-->/g,'');
    var parts = clean.split(/(?=^## )/m);
    var html = '';
    for(var i=0;i<parts.length;i++){
      var s = parts[i].trim(); if(!s) continue;
      var m = s.match(/^##\s+\d+\.\s+(GET|POST|PUT|PATCH|DELETE|HEAD|OPTIONS)\s+(.+?)(?:\s+-\s+(.*))?$/m);
      if(m){
        var method = m[1], url = m[2].trim(), title = (m[3]||'').trim();
        var body = s.split('\n').slice(1).join('\n');
        var bodyHtml = marked.parse(translateMd(body));
        // Colorize status codes
        bodyHtml = bodyHtml.replace(
          /<blockquote>\s*<p>([^<]+?)\s*(\d{3})\s*<\/p>\s*<\/blockquote>/g,
          function(match, prefix, code) {
            var sc = parseInt(code);
            var cls = sc >= 200 && sc < 300 ? 'success' : (sc >= 400 ? 'error' : (sc >= 300 ? 'redirect' : 'info'));
            return '<blockquote><p>' + prefix + ' <span class="doc-ep-status ' + cls + '">' + code + '</span></p></blockquote>';
          }
        );
        var titleHtml = (title || url) ? '<div class="doc-ep-title">📌 ' + esc(title || url) + '</div>' : '';
        html += '<div class="doc-endpoint">' + titleHtml + '<div class="doc-endpoint-header">'+
          '<span class="doc-ep-method '+method.toLowerCase()+'">'+method+'</span>'+
          '<span class="doc-ep-url">'+esc(url)+'</span>'+
          '</div><div class="doc-endpoint-body">'+marked.parse(translateMd(body))+'</div></div>';
      }else{
        html += marked.parse(translateMd(s));
      }
    }
    document.getElementById('doc-content').innerHTML = html;
    requestAnimationFrame(function(){
      document.querySelectorAll('pre code').forEach(function(el){if(typeof hljs!=='undefined')hljs.highlightElement(el);});
    });
  }

  function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML;}
})();
</script>
</body>
</html>
